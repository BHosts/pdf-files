<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        #msg {
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 40px;
        }
    </style>
</head>
<body>
    <div id="msg" style="display:none;">لم يتم تحديد ملف PDF. أضف ?file=اسم_الملف.pdf إلى الرابط.</div>
    <iframe id="pdfFrame" style="display:none;"></iframe>

    <script>
        // قراءة اسم الملف من رابط الصفحة، مثال:
        // https://bhosts.github.io/pdf-files/?file=testFile.pdf
        const params = new URLSearchParams(window.location.search);
        const fileName = params.get('file');

        if (fileName) {
            const frame = document.getElementById('pdfFrame');
            frame.src = fileName;
            frame.style.display = 'block';
        } else {
            document.getElementById('msg').style.display = 'block';
        }
    </script>
</body>
</html>
